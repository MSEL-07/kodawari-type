<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>こだわりタイプ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  /* レイアウト：スマホ1列。上から「説明 → 12問 → 結果」。結果は全問回答で下に出る */
  :root {
    --bg: #f6f4ee;
    --surface: #ffffff;
    --ink: #26323a;
    --sub: #5d6a72;
    --line: #d9dfe2;
    --accent: #3f7a8c;
    --accent-soft: #e2eef2;
    --pick: #e0874a;
    --pick-soft: #fbeadc;
    --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
    --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #172026; --surface: #1f2b32; --ink: #e8eef0; --sub: #a9b7bd; --line: #33434b;
      --accent: #7fb6c7; --accent-soft: #24414b; --pick: #f0a26b; --pick-soft: #4a3424; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #172026; --surface: #1f2b32; --ink: #e8eef0; --sub: #a9b7bd; --line: #33434b;
    --accent: #7fb6c7; --accent-soft: #24414b; --pick: #f0a26b; --pick-soft: #4a3424; color-scheme: dark;
  }

  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 48px;
  }
  .wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }

  header { display: grid; gap: 8px; }
  .kicker { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
  h1 { font-family: var(--font-display); font-weight: 900; font-size: 34px; line-height: 1.3; margin: 0; }
  .sp-br { display: none; }
  @media (max-width: 520px) {
    h1 { font-size: clamp(20px, 6.6vw, 30px); }
    .sp-br { display: inline; }
    .nw { white-space: nowrap; }
  }
  .lead { color: var(--sub); margin: 0; }

  .scale-note { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); font-weight: 700; padding: 0 4px; }

  ol.qs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 12px; display: grid; gap: 10px; }
  .q.done { border-color: var(--accent); }
  .q-text { display: flex; gap: 10px; font-weight: 700; }
  .q-no { flex: none; font-family: var(--font-display); color: var(--accent); min-width: 2.2em; }
  .opts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .opts label { position: relative; }
  .opts input { position: absolute; opacity: 0; inset: 0; margin: 0; }
  .opts span {
    display: grid; place-items: center; height: 44px; border-radius: 10px; border: 1.5px solid var(--line);
    font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer; background: var(--surface); transition: background .15s, border-color .15s;
  }
  .opts input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .opts input:focus-visible + span { outline: 3px solid var(--pick); outline-offset: 2px; }
  .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); }

  .status { position: sticky; bottom: max(12px, env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 10px 18px; text-align: center; font-weight: 700; font-size: 14px; }

  .result { background: var(--surface); border: 2px solid var(--pick); border-radius: 18px; padding: 20px 18px; display: grid; gap: 16px; }
  .result h2 { font-family: var(--font-display); font-size: 16px; margin: 0; color: var(--sub); font-weight: 700; }
  .type { display: grid; gap: 6px; }
  .type + .type { border-top: 1px dashed var(--line); padding-top: 14px; }
  .type-name { font-family: var(--font-display); font-weight: 900; font-size: 28px; line-height: 1.3; }
  .type-name .emoji { font-size: 40px; vertical-align: -6px; margin-right: 6px; }
  .value { display: inline-block; background: var(--pick-soft); color: var(--ink); border-radius: 999px; padding: 2px 12px; font-size: 13px; font-weight: 700; justify-self: start; }
  .type p { margin: 0; }
  .tie-note { margin: 0; background: var(--pick-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 700; }

  .bars { display: grid; gap: 6px; }
  .bar { display: grid; grid-template-columns: 7.5em 1fr 2em; gap: 8px; align-items: center; font-size: 13px; }
  .track { height: 10px; background: var(--accent-soft); border-radius: 5px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); border-radius: 5px; }
  .bar.top .fill { background: var(--pick); }
  .bar b { font-variant-numeric: tabular-nums; text-align: right; }

  button {
    font: inherit; font-weight: 700; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent);
    padding: 8px 14px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--pick); outline-offset: 2px; }
  .reset { justify-self: start; border-color: var(--line); color: var(--sub); }

  footer { font-size: 12px; color: var(--sub); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">2年目キャリアデザイン研修｜事前課題</div>
    <h1>自分の<br class="sp-br"><span class="nw">「こだわりタイプ」を知ろう</span></h1>
    <p class="lead">人がイライラ・モヤモヤするのは、自分が大切にしている「こだわり」が守られなかったときです。12の質問に答えると、あなたのタイプが分かります。</p>
  </header>

  <div class="scale-note"><span>1：当てはまらない</span><span>5：当てはまる</span></div>
  <ol class="qs" id="qs"></ol>

  <div class="status" id="status" aria-live="polite">あと12問</div>

  <section class="result" id="result" hidden aria-live="polite">
    <h2>あなたのこだわりタイプは…</h2>
    <div id="types"></div>
    <div class="bars" id="bars" aria-label="タイプごとの点数（2〜10点）"></div>
    <p class="tie-note" id="tie" hidden></p>
    <button type="button" class="reset" id="reset">最初からやり直す</button>
  </section>

  <footer>出典：日本アンガーマネジメント協会<br>タイプは「こういう人」という決めつけではなく、「こういう場面で気持ちが動きやすい」という傾向です。研修当日に詳しく解説します！</footer>
</div>

<script>
  const QUESTIONS = [
    "正しさ、規律、マナーなどを尊重する方だ。",
    "何事も白黒つけたいと思う方だ。",
    "人についていくよりも、引っ張る方だ。",
    "頑固だとよく言われる。",
    "後先考えずに行動するのは苦手だ。",
    "マイペースと言われることがある。",
    "不正などはなるべく正したいと思う。",
    "完璧主義なところがある。",
    "プライドが高いところがある。",
    "譲りたくない自分ルールがある。",
    "人見知りする方だ。",
    "空気を読めない（読まない）と言われたことがある。",
  ];
  // 判定：Q1+Q7、Q2+Q8、Q3+Q9、Q4+Q10、Q5+Q11、Q6+Q12（出典の資料どおり）
  const TYPES = [
    { e: "🐶", n: "熱血柴犬タイプ", q: [0, 6], v: "正しさ・マナー",
      d: "とても正義感が強いタイプです。間違ったことがあれば正したいと思いますし、そうすることが当然のことと考えています。正義感の強さから、周りが言いにくいような相手の間違いを指摘したり、こちらの正しさを主張することができます。" },
    { e: "🐼", n: "白黒パンダタイプ", q: [1, 7], v: "はっきりさせること",
      d: "何事にも白黒をつけたがる傾向があります。良いか悪いか、好きか嫌いか、0か1か、敵か味方かといった具合に両極端に物事を分けます。はっきりしていてわかりやすい性格ですが、グレーなことや曖昧なことをスルーするのが苦手です。" },
    { e: "🦁", n: "俺様ライオンタイプ", q: [2, 8], v: "自分の役割・プライド",
      d: "人を引っ張るリーダー的な役割を担うことが多いタイプです。人をまとめる、頼られる存在でいることを自覚している面倒見の良い、親分肌なところがあります。一方、自分よりもできない人、回転が遅い人を見下してみるような悪癖があります。プライドが高いので、自分から折れる、非を認めることが苦手です。" },
    { e: "🐑", n: "頑固ヒツジタイプ", q: [3, 9], v: "自分のルール",
      d: "思い込みが強く、自分ルールがあり、柔軟にその場のルールで動くことが苦手です。いつものルール通りであれば気持ちよく動けるのですが、イレギュラーなことが起きると、大きな違和感と抵抗感をもちます。頑固さは、良く言えば信念を曲げず動けることですが、その一方で柔軟さに欠けたり、融通が利きづらいところがあります。" },
    { e: "🐰", n: "慎重ウサギタイプ", q: [4, 10], v: "安心・慎重さ",
      d: "慎重に物事を考え行動するタイプです。発言は控えめで、リスクを負うことを嫌がるので、直接的な表現よりも遠回しな言い方が多くなります。それによって周りから誤解されることもよくあります。大勢の人と一緒にいることは好みませんが、人と適切な距離を保ち、遠くから客観的に観察することに長けています。" },
    { e: "🐱", n: "自由ネコタイプ", q: [5, 11], v: "自分のペース",
      d: "天真爛漫なタイプ。自分の思いのまま、気ままに後先考えず行動できます。また、誰とでも分け隔てなく仲良くなることもできます。しかし裏を返せば、空気を読むことが苦手で、人との距離感を上手に取れないため、相手が入ってきて欲しくないスペースまで踏み込んでしまうことがあります。" },
  ];

  const KEY = "kodawari-answers";
  const qs = document.getElementById("qs");
  const statusEl = document.getElementById("status");
  const result = document.getElementById("result");
  const answers = Array(12).fill(null);

  QUESTIONS.forEach((text, i) => {
    const li = document.createElement("li");
    li.className = "q"; li.id = "q" + (i + 1);
    li.innerHTML = `<div class="q-text"><span class="q-no">Q${i + 1}</span><span id="qt${i + 1}">${text}</span></div>
      <div class="opts" role="radiogroup" aria-labelledby="qt${i + 1}">
        ${[1, 2, 3, 4, 5].map(v => `<label><input type="radio" name="a${i + 1}" id="a${i + 1}-${v}" value="${v}"><span>${v}</span></label>`).join("")}
      </div>
      <div class="ends"><span>当てはまらない</span><span>当てはまる</span></div>`;
    qs.appendChild(li);
  });

  function save() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }
  function load() {
    try {
      const v = JSON.parse(localStorage.getItem(KEY) || "null");
      if (Array.isArray(v) && v.length === 12) v.forEach((x, i) => {
        if (x >= 1 && x <= 5) { answers[i] = x; const r = document.getElementById(`a${i + 1}-${x}`); if (r) r.checked = true; }
      });
    } catch (e) {}
  }

  function render() {
    answers.forEach((v, i) => document.getElementById("q" + (i + 1)).classList.toggle("done", v !== null));
    const left = answers.filter(v => v === null).length;
    if (left > 0) {
      statusEl.hidden = false;
      statusEl.textContent = `あと${left}問で結果が出ます`;
      result.hidden = true;
      return;
    }
    statusEl.hidden = true;
    const scores = TYPES.map(t => answers[t.q[0]] + answers[t.q[1]]);
    const max = Math.max(...scores);
    const tops = TYPES.filter((_, i) => scores[i] === max);

    document.getElementById("types").innerHTML = tops.map(t => `
      <div class="type">
        <div class="type-name"><span class="emoji" aria-hidden="true">${t.e}</span>${t.n}</div>
        <span class="value">大切にしていること：${t.v}</span>
        <p>${t.d}</p>
      </div>`).join("");
    const tie = document.getElementById("tie");
    tie.hidden = tops.length < 2;
    tie.textContent = `合計点が一番高いタイプが${tops.length}つありました。どのタイプの特徴も強く出ていると考えてください。診断結果を報告するときは、解説を読んで、どれがより自分らしいかを選んで報告してください。`;

    document.getElementById("bars").innerHTML = TYPES.map((t, i) => `
      <div class="bar${scores[i] === max ? " top" : ""}"><span>${t.e} ${t.n.replace("タイプ", "")}</span>
        <div class="track"><div class="fill" style="width:${scores[i] / 10 * 100}%"></div></div><b>${scores[i]}</b></div>`).join("");

    result.hidden = false;
  }

  qs.addEventListener("change", e => {
    const m = e.target.name && e.target.name.match(/^a(\d+)$/);
    if (!m) return;
    const i = Number(m[1]) - 1;
    const wasComplete = answers.every(v => v !== null);
    answers[i] = Number(e.target.value);
    save(); render();
    if (!wasComplete && answers.every(v => v !== null)) result.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  document.getElementById("reset").addEventListener("click", () => {
    answers.fill(null);
    document.querySelectorAll(".opts input").forEach(r => (r.checked = false));
    save(); render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  load(); render();
</script>
</body>
</html>
